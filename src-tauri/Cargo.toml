[package]
name = "evachi"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "Hote d'emulation multi-systemes"
license = "GPL-3.0-or-later"

[workspace]
members = ["test-core"]

[lib]
name = "evachi"
path = "src/lib.rs"

[[bin]]
name = "evachi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
thiserror = "2"
tauri-plugin-dialog = "2"
# Installation des cœurs depuis la forge officielle libretro. EvaChi ne
# redistribue aucun émulateur : elle va les chercher à leur source, à la demande.
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Pas de dépendance vers `test-core` : il est chargé dynamiquement par les tests,
# et le lier en plus ferait entrer ses symboles `retro_*` dans le binaire de test.

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
