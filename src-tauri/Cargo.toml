[package]
name = "evachi"
version = "0.6.3"
edition = "2021"
rust-version = "1.77"
description = "Hote d'emulation multi-systemes"
license = "GPL-3.0-or-later"

[workspace]
members = ["test-core"]

[lib]
name = "evachi"
path = "src/lib.rs"

[[bin]]
name = "evachi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compile l'éclat de C qui porte le journal des cœurs : libretro y veut une
# fonction variadique, que Rust stable ne sait pas définir.
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
thiserror = "2"
tauri-plugin-dialog = "2"
# Installation des cœurs depuis la forge officielle libretro. EvaChi ne
# redistribue aucun émulateur : elle va les chercher à leur source, à la demande.
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# PCSX2 et Xenia ne publient qu'en 7z.
sevenz-rust = "0.6"

# Contexte OpenGL pour les coeurs 3D. WGL directement plutot qu une couche
# de fenetrage : la fenetre est cachee et ne sert qu a porter le contexte.
#
# Et, depuis l isolement des coeurs : le tuyau nomme et la memoire partagee qui
# relient la fenetre au processus qui tient le coeur, l objet Job qui garantit
# qu aucun enfant ne survit a sa fenetre, et de quoi empecher Windows de brider
# un processus sans fenetre visible ou d afficher sa boite d erreur.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# Pas de dépendance vers `test-core` : il est chargé dynamiquement par les tests,
# et le lier en plus ferait entrer ses symboles `retro_*` dans le binaire de test.

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
